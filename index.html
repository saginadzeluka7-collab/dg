<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS Grid</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="frame">

        <div class="markers markers--top">
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
        </div>
        <div class="markers markers--bottom">
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
        </div>
        <div class="markers markers--left">
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
        </div>
        <div class="markers markers--right">
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
            <span class="tag"></span>
        </div>

        <div class="boxes">
            <div class="box green"></div>
            <div class="box blue"></div>
            <div class="box orange"></div>
            <div class="box teal"></div>
            <div class="box gray"></div>
            <div class="box pink"></div>
        </div>

        <div class="lines">
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
            <span class="cell"></span>
        </div>

    </div>

</body>

</html>
